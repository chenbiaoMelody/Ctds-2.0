# Alertmanager routing config (WBS 2.5.3, spec: ADR-014).
# v1 baseline: default route only - alerts are grouped and visible in the UI /
# API, silencing works; real outbound notifications (email/webhook) are a
# production task extension point registered in ADR-014.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ctds-alertmanager-config
  namespace: ctds-monitoring
  labels:
    app.kubernetes.io/part-of: ctds
    app.kubernetes.io/name: ctds-alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: ctds-default
      group_by: [alertname]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h
    receivers:
      - name: ctds-default
