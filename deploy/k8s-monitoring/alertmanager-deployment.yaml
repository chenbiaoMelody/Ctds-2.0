# Alertmanager (WBS 2.5.3, spec: ADR-014). Routing config v1 = default null
# receiver; alerts visible/grouped/silenced in UI and API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctds-alertmanager
  namespace: ctds-monitoring
  labels:
    app.kubernetes.io/part-of: ctds
    app.kubernetes.io/name: ctds-alertmanager
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ctds-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ctds
        app.kubernetes.io/name: ctds-alertmanager
        app.kubernetes.io/component: monitoring
    spec:
      containers:
        - name: ctds-alertmanager
          image: prom/alertmanager:v0.34.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
        - name: config
          configMap:
            name: ctds-alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ctds-alertmanager
  namespace: ctds-monitoring
  labels:
    app.kubernetes.io/part-of: ctds
    app.kubernetes.io/name: ctds-alertmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ctds-alertmanager
  ports:
    - port: 9093
      targetPort: 9093
