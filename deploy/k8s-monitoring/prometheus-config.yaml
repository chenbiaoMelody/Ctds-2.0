# Prometheus scrape + alert rules config (WBS 2.5.3, spec: ADR-014).
# Discovery: pod annotation based (prometheus.io/scrape|port|path on the pod
# template in deploy/k8s/backend-deployment.yaml). `job` is relabeled from the
# pod label app.kubernetes.io/name so alert rules can select job="ctds-backend".
apiVersion: v1
kind: ConfigMap
metadata:
  name: ctds-prometheus-config
  namespace: ctds-monitoring
  labels:
    app.kubernetes.io/part-of: ctds
    app.kubernetes.io/name: ctds-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: job
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
    rule_files:
      - /etc/prometheus/rules.yml

  rules.yml: |
    groups:
      - name: ctds-platform
        rules:
          # "or absent(...)" keeps the alert deterministic when the target
          # disappears entirely (scaled to 0 / pod gone): up goes stale.
          - alert: CtdsBackendDown
            expr: up{job="ctds-backend"} == 0 or absent(up{job="ctds-backend"})
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 平台后端服务下线
              description: 后端 ctds-backend 抓取目标缺失或 up=0 已持续 1 分钟
          # NaN (no traffic at all) evaluates false = safe side, no false alarm.
          - alert: CtdsBackendHighErrorRate
            expr: sum(rate(http_server_requests_seconds_count{job="ctds-backend",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="ctds-backend"}[5m])) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 平台后端 HTTP 错误率异常
              description: 后端 5 分钟窗口 5xx 错误率超过 5%
