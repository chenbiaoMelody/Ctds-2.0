# C-TDS backend Deployment (WBS 2.5.1, spec: ADR-013).
# IMAGE_PLACEHOLDER is injected by the 2.5.2 deployment toolchain with the
# canonical tag from scripts/pipeline/image-tag.ps1 (naming spec: ADR-012).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctds-backend
  labels:
    app.kubernetes.io/part-of: ctds
    app.kubernetes.io/name: example-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-service
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ctds
        app.kubernetes.io/name: example-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: example-service
          # Image reference is injected by the 2.5.2 toolchain using the
          # canonical tag from scripts/pipeline/image-tag.ps1 (spec: ADR-012).
          # Only the `image:` field below is replaced - inject by line, not
          # by string search.
          image: IMAGE_PLACEHOLDER
          securityContext:
            # Image USER is appuser (uid 1001); non-root is verified at run.
            runAsNonRoot: true
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              # OOM beyond the limit is recovered by the K8s restart policy
              # (hifi B-6); JVM heap follows the limit via MaxRAMPercentage.
              cpu: "1000m"
