# C-TDS backend Service (WBS 2.5.1, spec: ADR-013 K2; label unified to
# ctds-backend per WBS-2.5.2, matching the Deployment selector).
apiVersion: v1
kind: Service
metadata:
  name: ctds-backend
  labels:
    app.kubernetes.io/part-of: ctds
    app.kubernetes.io/name: ctds-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ctds-backend
  ports:
    - port: 8080
      targetPort: 8080
