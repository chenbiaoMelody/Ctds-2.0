# C-TDS evidence-service Deployment (WBS-3.8.2, spec: docs/designs/WBS-3.8.2-hifi.md §8;
# template follows metering-billing-deployment.yaml per ADR-013, WBS-2.5.2 label conventions).
# IMAGE_PLACEHOLDER is injected by the 2.5.2 deployment toolchain convention (ADR-012).
# ACTIVATION NOTE: not yet runnable in the demo cluster - prerequisites registered in the
# delivery note: (1) evidence image added to the nightly build / ModuleMap wiring (2.5.x),
# (2) `ctds_evidence` database bootstrap (CREATE DATABASE, same operational line as
# ctds_metering/ctds_delivery), (3) CTDS_DB credentials injected via secret/env at activation -
# credentials never enter the repo (charter red line 7). Until then the pod stays
# ImagePullBackOff if applied: expected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctds-evidence-service
  labels:
    app.kubernetes.io/part-of: ctds
    app.kubernetes.io/name: ctds-evidence-service
    app.kubernetes.io/component: evidence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ctds-evidence-service
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ctds
        app.kubernetes.io/name: ctds-evidence-service
        app.kubernetes.io/component: evidence
    spec:
      containers:
        - name: ctds-evidence-service
          # Image reference is injected by the 2.5.2 toolchain convention (ADR-012).
          image: IMAGE_PLACEHOLDER
          securityContext:
            runAsNonRoot: true
          ports:
            - containerPort: 8090
          readinessProbe:
            tcpSocket:
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            # mysql profile is required (JdbcClient repositories; default profile is
            # fail-fast non-startable by design, ADR-009/DB-24).
            - name: SPRING_PROFILES_ACTIVE
              value: "mysql"
            # In-cluster relaxation of the host-demo loopback binding (ADR-016 §2.7):
            # ClusterIP keeps the service non-exposed.
            - name: SPRING_SERVER_ADDRESS
              value: "0.0.0.0"
            # DB credentials are injected via secret/env at activation (2.5.x);
            # keys only, no real credentials in the repo (charter red line 7).
            - name: CTDS_DB_URL
              value: "jdbc:mysql://ctds-mysql:3306/ctds_evidence"
            - name: CTDS_DB_USER
              value: "ctds"
            - name: CTDS_DB_PASSWORD
              value: ""
            # Evidence gateway provider (Q1-A): local immutable ledger by default.
            # Real FISCO BCOS adapter stays a tracked condition pending image + SDK approval.
            - name: CTDS_EVIDENCE_CHAIN_PROVIDER
              value: "local"
            - name: CTDS_EVIDENCE_CHAIN_ENABLED
              value: "true"
            # Cross-domain audit-trail base URLs (WBS-3.8.4 hifi §6 ruling: config completion,
            # not a structural change; the only k8s diff of this card). In-cluster Service DNS
            # per 3.8.3 BASEURL conventions; evidence is the sole caller (audit read surface).
            - name: CTDS_EVIDENCE_SPACE_BASEURL
              value: "http://ctds-space-service:8083"
            - name: CTDS_EVIDENCE_CONTRACT_BASEURL
              value: "http://ctds-contract-service:8085"
            - name: CTDS_EVIDENCE_DELIVERY_BASEURL
              value: "http://ctds-delivery-service:8087"
