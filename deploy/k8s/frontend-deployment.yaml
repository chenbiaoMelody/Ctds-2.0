# C-TDS frontend Deployment (WBS 2.5.1, spec: ADR-013).
# IMAGE_PLACEHOLDER is injected by the 2.5.2 deployment toolchain with the
# canonical tag from scripts/pipeline/image-tag.ps1 (naming spec: ADR-012).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctds-frontend
  labels:
    app.kubernetes.io/part-of: ctds
    app.kubernetes.io/name: ctds-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ctds-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ctds
        app.kubernetes.io/name: ctds-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: ctds-frontend
          # Image reference is injected by the 2.5.2 toolchain using the
          # canonical tag from scripts/pipeline/image-tag.ps1 (spec: ADR-012).
          # Only the `image:` field below is replaced - inject by line, not
          # by string search. Non-root hardening deferred to 2.5.2 (review 2).
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
