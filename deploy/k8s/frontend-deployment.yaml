# C-TDS frontend Deployment (WBS 2.5.1, spec: ADR-013; non-root hardening
# and port 8080 per WBS-2.5.2, review-2 finding of 2.5.1 resolved).
# IMAGE_PLACEHOLDER is injected by the 2.5.2 deployment toolchain with the
# canonical tag from scripts/pipeline/image-tag.ps1 (naming spec: ADR-012).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctds-frontend
  labels:
    app.kubernetes.io/part-of: ctds
    app.kubernetes.io/name: ctds-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ctds-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ctds
        app.kubernetes.io/name: ctds-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: ctds-frontend
          # Image reference is injected by the 2.5.2 toolchain using the
          # canonical tag from scripts/pipeline/image-tag.ps1 (spec: ADR-012).
          # Only the `image:` field below is replaced - inject by line, not
          # by string search.
          image: IMAGE_PLACEHOLDER
          securityContext:
            # Image USER is uid 101 (image-built-in nginx user); nginx
            # listens on unprivileged 8080 (WBS-2.5.2 hardening).
            runAsNonRoot: true
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
