# C-TDS frontend Service (WBS 2.5.1, spec: ADR-013 K4; targetPort moved to
# 8080 per WBS-2.5.2 non-root hardening - container no longer listens on 80).
apiVersion: v1
kind: Service
metadata:
  name: ctds-frontend
  labels:
    app.kubernetes.io/part-of: ctds
    app.kubernetes.io/name: ctds-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ctds-frontend
  ports:
    - port: 80
      targetPort: 8080
