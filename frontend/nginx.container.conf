# nginx server block for the C-TDS SPA container (WBS 2.5.1, spec ADR-013
# F1; listen port amended to 8080 by WBS 2.5.2 non-root hardening).
# Mounted as /etc/nginx/conf.d/default.conf by frontend/Dockerfile.
server {
    # 8080: unprivileged port (ports <1024 need root); the frontend Service
    # targetPort and the tcpSocket probes match this port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        # SPA history-mode routing fallback (hifi B-5): deep links like /login
        # must serve index.html instead of 404 on refresh.
        try_files $uri $uri/ /index.html;
    }
}
