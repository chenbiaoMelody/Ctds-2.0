# nginx MAIN config for the C-TDS SPA container (WBS 2.5.2 non-root
# hardening, spec ADR-013 as amended by WBS-2.5.2). Mounted as
# /etc/nginx/nginx.conf by frontend/Dockerfile.
#
# Everything the master process must write lives under /tmp: as uid 101
# (image-built-in nginx user) those are the only paths guaranteed writable.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
