spring:
  application:
    name: catalog-service
  # 数据库迁移工具链（WBS 2.4.10 / ADR-009），沿 space-service 同款模式：**默认 profile 不可启动**——
  # classpath 上有 spring-boot-starter-jdbc 会激活 DataSourceAutoConfiguration 并要求配置数据源，
  # 且仓储实现构造器硬依赖 JdbcClient，默认 profile 无该 Bean（DB-24 同族口径，只增不减的安全默认）；
  # 演示与服务一律 mysql profile（application-mysql.yml）。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: 8084
  # 防御性回环（DB-24 同族口径）：默认 profile 亦显式绑定回环作配置级安全默认；
  # 演示期安全边界 ADR-016 §2.7——服务仅本机可达，不得对外暴露；k8s 部署经清单环境变量放宽。
  address: 127.0.0.1

logging:
  file:
    name: logs/app.log
  structured:
    format:
      console: logstash
      file: logstash

ctds:
  # RBAC（WBS 2.4.5 模式 A 配置映射；WBS-3.3.2 hifi §1 权限点四枚 + 3.3.3 vocabulary.read +
  # 3.3.4 catalog.read/catalog.interact 两枚 + 3.3.5 catalog.product/catalog.governance 两枚）：
  # 演示期提供方主体角色持八点、admin 角色持四点（沿 space 双轨先例——写动作另有登记主体本人/
  # 条目本人判定，权限点是第一道功能门槛；catalog.interact 为业务交互动作〔收藏/订阅〕，admin 不持；
  # catalog.product 为产品管理动作〔封装/上下架/注销〕，admin 不持；catalog.governance 为治理
  # 例外读面〔R12/R13 治理详情 + W12 强制下架〕，provider 不持）。
  auth:
    permissions:
      provider: dataset.register,dataset.update,dataset.cancel,dataset.read,vocabulary.read,catalog.read,catalog.interact,catalog.product
      admin: dataset.read,vocabulary.read,catalog.read,catalog.governance
      # 服务间内部只读专用（WBS-3.4.3 Q6-A 衔接，ADR-016 §6 第 6 消费方）：仅 contract-internal 持有，
      # provider/admin 业务角色均不持有——防产品状态枚举（沿 subject.internal.read 先例）。
      contract-internal: catalog.internal.read
  # 目录与资源服务参数（WBS-3.3.2 hifi §4~§5）
  catalog:
    # 主体服务衔接（资格判定只读通道，subject yml 已加 catalog-internal 1 行授权）：
    # 未配置 = 资格判定不可用（1007S0001，不冒充"未入驻"防枚举）。
    subject:
      base-url: ${CTDS_CATALOG_SUBJECT_BASEURL:}
    # 空间服务衔接（空间状态+成员判定只读通道，space yml 已加 catalog-internal 1 行授权）：
    # 未配置 = 空间判定不可用（1007S0002，不冒充"非成员/空间不存在"防枚举）。
    space:
      base-url: ${CTDS_CATALOG_SPACE_BASEURL:}
  # 登记防重复提交（ADR-007 模式 B）：内存模式 = 零中间件依赖，演示/单测可执行；
  # 多实例生产部署须 mode=redis 并经 redisson-spring-boot-starter 提供 Redis 连接（WBS-2.4.7 hifi B8 边界）
  idempotency:
    mode: memory
  lock:
    mode: memory
