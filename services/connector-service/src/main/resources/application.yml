spring:
  application:
    name: connector-service
  # 默认 profile 不装载数据源（沿 delivery/catalog 先例）：classpath 有 spring-boot-starter-jdbc 会激活
  # DataSourceAutoConfiguration 并要求配置数据源；运行与服务一律 mysql profile（application-mysql.yml）。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: 8088
  # 演示期安全边界（ADR-016 §2.7）：服务仅绑定回环，不得对外暴露。
  address: 127.0.0.1

logging:
  file:
    name: logs/app.log
  structured:
    format:
      console: logstash
      file: logstash

ctds:
  # 连接器域角色点（WBS-3.6.3 hifi §1）：applicant = 参与方（申请/读/心跳）；
  # admin = 平台运营方（核验/读/内部面直调）。internal 消费方角色由 3.6.4+ 各卡追加。
  auth:
    permissions:
      applicant: connector.register,connector.read,connector.heartbeat
      admin: connector.review,connector.read,connector.internal.read
      # 服务身份专用内部面角色（本服务作为被调方；3.6.4 / 3.6.7 / 3.6.8 与 SDK 校验消费，ADR-027 §2）
      connector-internal: connector.internal.read
  connector:
    # 跨域只读调用（服务身份 connector-service / connector-internal；未配置 = 判定不可用 → 503 fail-closed）
    subject:
      base-url: ${CTDS_CONNECTOR_SUBJECT_BASEURL:}
      timeout: 3s
    did:
      base-url: ${CTDS_CONNECTOR_DID_BASEURL:}
      timeout: 3s
    # 最小健康度（规格 §7 Q8-A）：最近心跳超过该阈值 = 离线；启动校验 1m~1440m
    health:
      offline-after: 5m
