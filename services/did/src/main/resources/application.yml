spring:
  application:
    name: did-service
  # 数据库迁移工具链（WBS 2.4.10 / ADR-009）：**默认 profile 不可启动**——仓储构造器依赖 JdbcClient，
  # 排除 DataSourceAutoConfiguration 后无该 Bean（同族口径见 kms DB-24）；演示与服务一律 mysql profile
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: 8082

# 指标暴露（ADR-014 最小暴露面）：只开 health 探活
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  file:
    name: logs/app.log
  structured:
    format:
      console: logstash
      file: logstash

ctds:
  # RBAC（WBS 2.4.5 模式 A）：运营管理员（吊销/重签/重试）需 did.admin 权限
  auth:
    permissions:
      admin: did.admin
  # DID → KMS 密钥对托管调用（内部回环，ADR-016 §2.7）；未配置则签发停留待签发
  did:
    kms:
      base-url: ${CTDS_DID_KMS_BASEURL:}
    # DID → 主体服务 绑定核验调用（内部回环，ADR-016 §2.7）；未配置 = 绑定核验不可用（验证回 UNAVAILABLE）
    subject:
      base-url: ${CTDS_DID_SUBJECT_BASEURL:}
    # 演示签名入口（规格 C-1.2 §6 第 6 条边界，WBS-3.1.11）：仅演示/调试期可用，
    # **默认关闭 = 生产禁用**（关闭时复用既有 1000C0003，不新增错误码）；演示期以环境变量显式开启
    demo-signature:
      enabled: ${CTDS_DID_DEMO_SIGNATURE_ENABLED:false}
