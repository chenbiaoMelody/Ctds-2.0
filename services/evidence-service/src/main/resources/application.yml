spring:
  application:
    name: evidence-service
  # 默认 profile 不装载数据源（沿 kms/metering-billing 先例）：classpath 有 spring-boot-starter-jdbc
  # 会激活 DataSourceAutoConfiguration 并要求配置数据源；演示与服务一律 mysql profile
  # （application-mysql.yml），默认 profile 仅作配置级安全默认。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: 8090
  # 演示期安全边界（ADR-016 §2.7）：服务仅绑定回环，不得对外暴露；
  # k8s 部署经清单环境变量放宽（ClusterIP 不外露）。
  address: 127.0.0.1

logging:
  file:
    name: logs/app.log
  structured:
    format:
      console: logstash
      file: logstash

ctds:
  # RBAC（WBS-3.8.2 hifi §1.2 Q6-A 权限最小面，实测基线 53 → 3.8.3 +2 = 55）：
  # 治理档持对外面全部读/核验/重试；业务系统服务身份只持内部写面（3.8.3 埋点使用）。
  # 参与方读面评估结论（WBS-3.8.4 Q5-A，2026-11-07 编排师确认）：V1.0 不开放（涉归属过滤与
  # 脱敏子集口径，非最小实现）——不新增 evidence.read，登记跟踪项（承接 = 3.8.5 评估或另立卡）。
  # 跟踪项终版结论（WBS-3.8.5 Q5-A，2026-11-08 编排师确认）：3.8.5 评估完成 = 不开放，跟踪项关闭；
  # 后续如有需求走规格变更另立卡。
  # 监管审计读面（3.8.4）不加权限点：服务内守卫口径（非治理档与"对象不存在"同码同文，Q4-A）。
  auth:
    permissions:
      admin: evidence.governance
      evidence-internal: evidence.internal.write
  # 存证网关（Q1-A）：provider 固定 local = 本地不可变哈希链账本；未知值启动 fail-fast。
  # enabled=false 仅用于演示期构造"链不可达"（需重启，无运行期开关/后门）。
  evidence:
    chain:
      provider: ${CTDS_EVIDENCE_CHAIN_PROVIDER:local}
      enabled: ${CTDS_EVIDENCE_CHAIN_ENABLED:true}
    # 跨域 audit-trail 回读（WBS-3.8.4 hifi §3 / Q1-A）：默认本机回环（本地直连演示口径），
    # k8s 由部署清单注入三变量（evidence-deployment +3 env，配置补齐非结构变更）；
    # 测试经属性注入桩地址（不依赖 env）。base-url 空白 = 该域留痕段按 UNAVAILABLE 降级。
    trail:
      space-base-url: ${CTDS_EVIDENCE_SPACE_BASEURL:http://127.0.0.1:8083}
      contract-base-url: ${CTDS_EVIDENCE_CONTRACT_BASEURL:http://127.0.0.1:8085}
      delivery-base-url: ${CTDS_EVIDENCE_DELIVERY_BASEURL:http://127.0.0.1:8087}
