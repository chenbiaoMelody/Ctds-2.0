spring:
  # 清空默认 profile 的 DataSourceAutoConfiguration 排除项（数据源 + Flyway 在本 profile 生效）
  autoconfigure:
    exclude: ""
  datasource:
    url: ${CTDS_DB_URL:jdbc:mysql://localhost:3306/ctds_demo}
    username: ${CTDS_DB_USER:root}
    # 口令只经环境变量注入（密钥零入库，章程红线 7）；默认空 = 未配置不可用
    password: ${CTDS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false

ctds:
  demo:
    # 迁移演示端点/仓储随本 profile 启用（与 profile 双保险，见 WBS-2.4.10-hifi B5/B6）
    db-enabled: true
