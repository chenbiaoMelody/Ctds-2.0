spring:
  application:
    name: example-service
  # 数据库迁移工具链（WBS 2.4.10 / ADR-009）：本服务默认 profile 无数据库照常启动（B3 兼容性决策）。
  # classpath 上有 spring-boot-starter-jdbc 会激活 DataSourceAutoConfiguration 并要求配置数据源，
  # 默认 profile 显式排除；mysql profile（application-mysql.yml）清空本排除项后数据源 + Flyway 生效。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: 8080

# 指标暴露（WBS 2.5.3 / hifi §2 最小暴露面）：只开 health 与 prometheus 两个端点，
# 其余 actuator 端点一律不开（MetricsEndpointTest env=404 守卫）；鉴权零改动（注解式按端点强制）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  file:
    name: logs/app.log
  structured:
    format:
      console: logstash
      file: logstash

# 鉴权演示规则（WBS 2.4.5 B9，模式 A 配置文件映射；3.9.2 后由库表来源覆盖）
ctds:
  auth:
    permissions:
      user: greeting.read,demo.read
      admin: greeting.read,greeting.delete,demo.read
  # 幂等与分布式锁演示（WBS 2.4.7 B11）：内存模式 = 零中间件依赖，演示/单测可执行；
  # 多实例生产部署须 mode=redis 并经 redisson-spring-boot-starter 提供 Redis 连接（hifi B8 边界）
  idempotency:
    mode: memory
  lock:
    mode: memory
