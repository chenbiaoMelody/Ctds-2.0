spring:
  application:
    name: kms-service
  # 数据库迁移工具链（WBS 2.4.10 / ADR-009）：**默认 profile 不可启动**——KeyJdbcRepository 构造器
  # 硬依赖 JdbcClient，排除 DataSourceAutoConfiguration 后无该 Bean（DB-24 实测
  # UnsatisfiedDependencyException，2026-09-21〔2026-09-25 立卡只读复核〕；
  # 同族口径见 did / subject 注释）；
  # 演示与服务一律 mysql profile（application-mysql.yml）。
  # classpath 上有 spring-boot-starter-jdbc 会激活 DataSourceAutoConfiguration 并要求配置数据源，
  # 默认 profile 显式排除；mysql profile 清空本排除项后数据源 + Flyway 生效。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: 8081
  # 防御性回环（清债卡3 / DB-24）：默认 profile 虽不可启动，仍显式绑定回环作配置级安全默认，
  # 与 mysql profile 的演示期安全边界（ADR-016 §2.7）同口径；只增不减、无行为影响。
  address: 127.0.0.1

# 指标暴露（ADR-014 最小暴露面）：KMS 只开 health 探活，prometheus 暴露随 2.5.x 监控基座统一接入
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  file:
    name: logs/app.log
  structured:
    format:
      console: logstash
      file: logstash

ctds:
  # 根密钥（密钥库加密根，规格行为 1）：只经环境变量注入（密钥零入库，章程红线 7）；
  # 缺失/坏值 = 启动失败 fail-fast（hifi §3.4，沿 2.4.6 密钥文件同款语义）
  kms:
    root-key: ${CTDS_KMS_ROOT_KEY:}
  # RBAC（WBS 2.4.5 模式 A 配置映射）：密钥创建/轮换 = 管理面，须 admin 角色（规格行为 2 GTT-3）；
  # 密钥供给读取面（GET material）为内部网络边界内服务间调用，不设 JWT（诚实边界见交付说明）
  auth:
    permissions:
      admin: kms.admin
