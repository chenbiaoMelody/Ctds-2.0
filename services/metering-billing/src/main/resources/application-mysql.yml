server:
  # 演示期安全边界（ADR-016 §2.7）：mysql profile 绑定回环，仅本机可访问。
  address: 127.0.0.1

spring:
  # 清空默认 profile 的 DataSourceAutoConfiguration 排除项（数据源 + Flyway 在本 profile 生效）
  autoconfigure:
    exclude: ""
  datasource:
    url: ${CTDS_DB_URL:jdbc:mysql://localhost:3306/ctds_metering}
    username: ${CTDS_DB_USER:root}
    # 口令只经环境变量注入（密钥零入库，章程红线 7）；默认空 = 未配置不可用
    password: ${CTDS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    baseline-on-migrate: false

ctds:
  metering:
    # 跨 schema 只读采集（Q1-A 通道 2）：事件源库名 = 配置化常量（hifi §2——演示环境改名不改代码）；
    # 账号需对两库事件源表 SELECT（演示环境配置义务见交付说明），本库 ctds_metering 读写。
    source-schema:
      delivery: ctds_delivery
      contract: ctds_contract
