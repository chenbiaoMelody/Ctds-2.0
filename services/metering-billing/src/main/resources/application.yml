spring:
  application:
    name: metering-billing
  # 默认 profile 不装载数据源（沿 kms/delivery 先例）：classpath 有 spring-boot-starter-jdbc 会激活
  # DataSourceAutoConfiguration 并要求配置数据源；演示与服务一律 mysql profile（application-mysql.yml）。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: 8089
  # 演示期安全边界（ADR-016 §2.7）：服务仅绑定回环，不得对外暴露；
  # k8s 部署经清单环境变量放宽（ClusterIP 不外露）。
  address: 127.0.0.1

logging:
  file:
    name: logs/app.log
  structured:
    format:
      console: logstash
      file: logstash

ctds:
  # 计量 + 计费域角色点（WBS-3.7.5 hifi §6 Q4-A 计量 2 点；WBS-3.7.6 hifi §8 Q8-A 计费 2 点，50→52）：
  # 需求方/提供方读本方流水、账单与对账结论（归属校验服务端硬保证）；运营方治理面
  # （触发采集 + 四方勾稽读数 + 手动出账 + 对账 + 确认 + 更正 + 全量账单检索）。
  auth:
    permissions:
      requester: metering.read,billing.read
      provider: metering.read,billing.read
      admin: metering.read,metering.governance,billing.read,billing.governance
  # 计费自动出账（WBS-3.7.6 hifi §4）：默认每月 1 日 00:10 出上月账；enabled/cron 可配。
  billing:
    auto:
      enabled: ${CTDS_BILLING_AUTO_ENABLED:true}
      cron: ${CTDS_BILLING_AUTO_CRON:0 10 0 1 * ?}
